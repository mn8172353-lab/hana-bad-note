<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2fbf8f">
<meta name="application-name" content="はなのバド上達ノート">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="バド上達ノート">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>はなのバド上達ノート</title>
<style>
:root{--bg:#ffffff;--card:#fff;--ink:#1f3a33;--sub:#6b8780;--main:#2fbf8f;--mainD:#1f9a72;--soft:#e8f9f2;--line:#c8ecdd;--warn:#e5604d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:16px}
main{max-width:560px;margin:0 auto;padding:12px 14px 110px}
header{background:linear-gradient(135deg,#2fbf8f,#5fd9b0);color:#fff;border-radius:22px;padding:16px 18px;margin-bottom:14px}
header h1{margin:0;font-size:21px}header p{margin:4px 0 0;font-size:13px;opacity:.95}
h2{font-size:19px;margin:6px 2px 10px}
h3{font-size:15px;margin:16px 2px 8px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(47,191,143,.08)}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;min-height:52px;font-size:16px;font-weight:600;padding:8px}
.chip.on{background:var(--soft);border-color:var(--main);color:var(--mainD)}
.chip.on::before{content:"✓ "}
textarea,input[type=text],input[type=date]{width:100%;border:2px solid var(--line);border-radius:14px;padding:12px;font-size:16px;background:var(--card);color:var(--ink);font-family:inherit}
textarea{min-height:76px;resize:vertical}
.btn{width:100%;min-height:56px;border:0;border-radius:18px;background:var(--main);color:#fff;font-size:18px;font-weight:700;margin-top:10px}
.btn:active{background:var(--mainD)}
.btn.sm{width:auto;min-height:48px;font-size:15px;padding:0 14px;margin:0}
.btn.ghost{background:var(--soft);color:var(--mainD)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row .btn{flex:1;min-width:70px}
.rec{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:8px;color:var(--ink);font-size:15px}
.rec b{color:var(--mainD)}.rec small{display:block;color:var(--sub);margin-top:4px;font-size:13px}
.det{white-space:pre-wrap;margin-top:8px;font-size:14px;line-height:1.6;border-top:1px dashed var(--line);padding-top:8px}
.bar{height:16px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#2fbf8f,#7be3bf);border-radius:99px;transition:width .3s}
.wk{display:flex;align-items:center;gap:8px;width:100%;border:2px solid transparent;background:transparent;color:var(--ink);padding:8px;border-radius:14px;font-size:14px}
.wk.sel{border-color:var(--main);background:var(--soft)}.wk .bar{flex:1}.wk span:first-child{width:52px;text-align:left}.wk span:last-child{width:42px;text-align:right}
.big{text-align:center;background:linear-gradient(135deg,#2fbf8f,#5fd9b0);color:#fff;border-radius:22px;padding:20px 10px;margin-bottom:12px}
.big div{font-size:46px;font-weight:800;line-height:1.1}.big small{font-size:15px}
.avg{font-size:30px;font-weight:800;color:var(--mainD)}
.sub{color:var(--sub);font-size:13px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;background:none;color:var(--sub);min-height:58px;font-size:12px;border-radius:16px;font-weight:600}
nav button span{display:block;font-size:24px}
nav button.on{color:var(--mainD);background:var(--soft)}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#1f3a33;color:#fff;padding:14px 22px;border-radius:99px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .3s;z-index:9}
#toast.show{opacity:1}
.hide{display:none}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--soft);color:var(--mainD);margin-left:4px}.badge.rep{background:#fde8e4;color:var(--warn)}.q{font-size:13px;color:var(--sub);margin-top:4px;line-height:1.5}
.item{display:flex;align-items:center;gap:6px;background:var(--soft);border-radius:14px;padding:2px 2px 2px 14px;margin-bottom:6px}.item span{flex:1}.item button{border:0;background:transparent;font-size:18px;min-width:46px;min-height:46px;color:var(--sub)}
.ck{display:flex;align-items:center;gap:12px;padding:12px;border:2px solid var(--line);border-radius:14px;margin-bottom:6px;font-size:16px}.ck input{width:26px;height:26px;accent-color:var(--main);flex:none}.ck.on{background:var(--soft);border-color:var(--main)}
.rec.past{opacity:.6}.warn{color:var(--warn)}
.gt{font-size:13px;font-weight:700;color:var(--mainD);margin:14px 2px 6px}.chips.menu .chip{min-height:46px;font-size:15px}
.pct{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.pct .chip{min-height:48px;padding:4px;font-size:15px}.pct .chip.on::before{content:""}
</style>
</head>
<body>
<main>
<header><h1>🏸 はなのバド上達ノート</h1><p>練習を記録して、次の一歩へ 🏸</p></header>
<div id="view"></div>
</main>
<div id="toast"></div>
<nav id="nav"></nav>
<script>
var KEY="hana_bad_v1";
var MENU_GROUPS=[{t:"💪 からだづくり",m:["ランニング","体幹","サーキット","手押車","ゴムチューブ"]},{t:"🏸 ラケットを使う",m:["サーブ","フットワーク","クリア","スマッシュ","ロブ","ヘアピン","プッシュ","ドロップ","ゲーム練習"]},{t:"➕ ほか",m:["その他"]}];
var MENUS=[].concat.apply([],MENU_GROUPS.map(function(g){return g.m}));
var FOCUS=["サーブミスを減らす","サーブを奥まで打つ","1歩目を速くする","フットワーク","打ったあとに戻る","体全体を使って打つ","相手の空いている場所を見る","その他"];
var GOAL_EX=["サーブを安定して奥まで入れる","1歩目を速くする","打ったあとに戻る","体全体を使って打つ"];
// データ構造: practices[], goals{"YYYY-MM":{title,weeks[5]}}, tournament{name,date,goal,focus[],focusOther}
var db=load();var tab="practice";var editG=false;var mamaView="an",mamaMonth=null;var editPid=null;var bkOpen=false;var draft={menus:[],other:"",good:"",bad:"",coach:"",nexts:[],nextIn:"",review:null};var openId=null;var selWeek=null;
function normalize(d){d.goals=d.goals||{};Object.keys(d.goals).forEach(function(k){var g=d.goals[k];if(!Array.isArray(g))d.goals[k]=g&&g.title?[{id:Number(k.replace('-','')),title:g.title,weeks:g.weeks||[0,0,0,0,0]}]:[]});if(!Array.isArray(d.tournaments)){d.tournaments=[];var t=d.tournament;if(t&&(t.name||t.date||t.goal||(t.focus&&t.focus.length)))d.tournaments.push({id:Date.now(),name:t.name||"",date:t.date||"",goal:t.goal||"",events:[],focus:t.focus||[],focusOther:t.focusOther||""})}delete d.tournament;d.tournaments.forEach(function(t){t.events=t.events||[];t.focus=t.focus||[]});return d}
function load(){try{var s=localStorage.getItem(KEY);if(s){var d=JSON.parse(s);if(d&&d.practices)return normalize(d)}}catch(e){}
return{practices:[],goals:{},tournaments:[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function p2(n){return(n<10?"0":"")+n}
function ymd(d){return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())}
function toast(m){var t=$("toast");t.textContent=m;t.className="show";setTimeout(function(){t.className=""},1800)}
var W=["日","月","火","水","木","金","土"];
function nav(){var t=[["practice","🏸","練習"],["goal","🎯","目標"],["match","🏆","大会"],["mama","👩","ママ"]];
$("nav").innerHTML=t.map(function(x){return'<button class="'+(tab==x[0]?"on":"")+'" onclick="go(\''+x[0]+'\')"><span>'+x[1]+'</span>'+x[2]+'</button>'}).join("")}
function go(t){tab=t;render();window.scrollTo(0,0)}
/* ママ用: 書かれた言葉をキーワードで分類して傾向を出す（分類は THEMES を編集） */
var THEMES=[
{k:"構える・準備",i:"🧍",w:["構え","待つ","準備","ラケットを上げ","ラケットを立て"]},
{k:"1歩目・動き出し",i:"👟",w:["1歩目","一歩目","動き出し","反応","スタート","出遅れ","動くのが遅"]},
{k:"打ったあとに戻る",i:"🔙",w:["戻","ホーム"]},
{k:"フットワーク",i:"🦶",w:["フットワーク","足","ステップ","移動","動き"]},
{k:"サーブ",i:"🎯",w:["サーブ","奥まで","ショート"]},
{k:"体の使い方",i:"💪",w:["体全体","体を","体重","腕","振り","スイング","肘","ひじ","手首","ひねり","回転"]},
{k:"打点・タイミング",i:"🏸",w:["打点","前で","高い","タイミング","落ちる","下がっ"]},
{k:"コース・相手を見る",i:"👀",w:["相手","空い","コース","狙","見る","見て"]},
{k:"ミス・安定",i:"🛡️",w:["ミス","入らな","ネット","アウト","安定","続か"]},
{k:"声・気持ち",i:"📣",w:["声","元気","笑顔","気持ち","あきら","集中","ファイト"]},
{k:"スピード・力",i:"⚡",w:["速く","スピード","強く","パワー","力"]}];
var OTHER={k:"その他",i:"📝",w:[]};
function items(s){return(s||"").split(/[\n。・／\/]+/).map(function(x){return x.trim()}).filter(Boolean)}
function themesOf(t){t=t.normalize("NFKC");var m=THEMES.filter(function(h){return h.w.some(function(w){return t.indexOf(w)>=0})});return m.length?m:[OTHER]}
function md(d){var a=d.split("-");return(+a[1])+"/"+(+a[2])}
function mMonths(){var s={};db.practices.forEach(function(r){s[r.date.slice(0,7)]=1});s[mkey()]=1;return Object.keys(s).sort()}
function prevKey(k){var a=k.split("-"),d=new Date(+a[0],+a[1]-2,1);return d.getFullYear()+"-"+p2(d.getMonth()+1)}
function setMM(k){mamaMonth=k;render();window.scrollTo(0,0)}
function setMV(x){mamaView=x;render()}
function setMama(id,v){db.practices.forEach(function(r){if(r.id===id)r.mama=v.trim()});save();toast("メモを保存しました 👩")}
function analyze(k){var recs=db.practices.filter(function(r){return k==="all"||r.date.slice(0,7)==k}).sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:a.id-b.id});
var n=recs.length,T={},all=THEMES.concat([OTHER]);all.forEach(function(h){T[h.k]={coach:[],bad:[],mama:[],good:[]}});
recs.forEach(function(r,idx){[["coach",r.coach],["bad",r.bad],["mama",r.mama],["good",r.good]].forEach(function(p){items(p[1]).forEach(function(it){themesOf(it).forEach(function(h){T[h.k][p[0]].push({i:idx,d:r.date,t:it})})})})});
var rows=[];all.forEach(function(h){var o=T[h.k],pr=o.coach.concat(o.bad,o.mama);if(!pr.length)return;
var lastP=Math.max.apply(null,pr.map(function(x){return x.i})),lastG=o.good.length?Math.max.apply(null,o.good.map(function(x){return x.i})):-1;
var cr=Array.from(new Set(o.coach.map(function(x){return x.i}))).length,recent=lastP>=n-4;
var st=lastG>lastP?"up":recent&&(cr>=2||pr.length>=3)?"rep":recent?"new":"quiet",score=0;
pr.forEach(function(x){score+=(x.i>=n-5?2:1)*(o.coach.indexOf(x)>=0?2:1.5)});o.good.forEach(function(x){if(x.i>=n-5)score-=2});
rows.push({h:h,o:o,cr:cr,lastD:recs[lastP].date,st:st,score:score,np:pr.length,nc:o.coach.length,nb:o.bad.length,nm:o.mama.length,ng:o.good.length})});
return{recs:recs,n:n,rows:rows}}
function bd(st){return{up:'<span class="badge">📈 改善中</span>',rep:'<span class="badge rep">🔥 くりかえし</span>',"new":'<span class="badge">🆕 最近の課題</span>',quiet:'<span class="badge">💤 最近は出ていない</span>'}[st]}
function parts(x){var p=[];if(x.nc)p.push("🗣 コーチ "+x.nc+"回");if(x.nb)p.push("🌱 できなかった "+x.nb+"回");if(x.nm)p.push("👩 ママ "+x.nm+"回");return p.join("・")}
function vMama(){var cur=mkey();if(!mamaMonth)mamaMonth=cur;var k=mamaMonth,ms=mMonths();
var h='<h2>👩 ママ用 <span class="sub">'+(k==="all"?"全期間":mlabel(k))+'</span></h2><div class="chips" style="margin-bottom:10px"><button class="chip'+(mamaView=="an"?" on":"")+'" onclick="setMV(\'an\')">📊 分析</button><button class="chip'+(mamaView=="memo"?" on":"")+'" onclick="setMV(\'memo\')">📝 ひとことメモ</button></div>';
if(k!=="all"){var mi=ms.indexOf(k),prev=mi>0?ms[mi-1]:null,next=mi<ms.length-1?ms[mi+1]:null;
h+='<div class="row" style="flex-wrap:nowrap;margin-bottom:8px"><button class="btn sm ghost" style="flex:1;opacity:'+(prev?1:.35)+'" '+(prev?'onclick="setMM(\''+prev+'\')"':'disabled')+'>◀ '+(prev?mlabel(prev):"")+'</button><button class="btn sm ghost" style="flex:1;opacity:'+(next?1:.35)+'" '+(next?'onclick="setMM(\''+next+'\')"':'disabled')+'>'+(next?mlabel(next):"")+' ▶</button></div>';
h+='<div class="row" style="margin-bottom:12px">'+(k!==cur?'<button class="btn sm ghost" onclick="setMM(\''+cur+'\')">今月にもどる</button>':'')+'<button class="btn sm ghost" onclick="setMM(\'all\')">全期間で見る</button></div>'}
else h+='<div class="row" style="margin-bottom:12px"><button class="btn sm ghost" onclick="setMM(\''+cur+'\')">月ごとに見る</button></div>';
return h+(mamaView=="an"?mamaAnalysis(k):mamaMemo(k))}
function mamaMemo(k){var list=db.practices.filter(function(r){return k==="all"||r.date.slice(0,7)==k}).sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:b.id-a.id}),h='<div class="sub" style="margin:0 2px 8px">練習のあとに、ママから見て気づいたことを1行で書いてね。分析にも使われます。</div>';
if(!list.length)h+='<div class="card sub">この期間の練習記録がありません。</div>';
list.forEach(function(r){h+='<div class="card"><b>'+md(r.date)+'</b>　'+esc(menuText(r))+(r.coach?'<div class="q">🗣 '+esc(r.coach)+'</div>':'')+'<input type="text" style="margin-top:8px" value="'+esc(r.mama||"")+'" placeholder="👩 ママのひとこと（例：構えが早くなった）" onchange="setMama('+r.id+',this.value)"></div>'});return h}
function mamaAnalysis(k){var a=analyze(k),h="";
if(!a.n)return h+'<div class="card sub">この期間の練習記録がありません。</div>';
var pv=k==="all"?null:analyze(prevKey(k)),pm={};if(pv)pv.rows.forEach(function(x){pm[x.h.k]=x});
var nc=0,nm=0,rv=[];a.recs.forEach(function(r){nc+=items(r.coach).length;nm+=items(r.mama).length;rv=rv.concat(r.review||[])});var dn=rv.filter(function(x){return x.done}).length;
h+='<div class="card"><b>📋 まとめ</b><div class="q">練習 '+a.n+'回 ／ コーチに言われたこと '+nc+'件 ／ ママのメモ '+nm+'件'+(rv.length?'<br>前回のがんばること：'+dn+' / '+rv.length+' できた':'')+'</div>'+(a.n<3?'<div class="q">※ 記録が少ないので、目安として見てね。</div>':'')+'</div>';
var rp=a.rows.filter(function(x){return x.cr>=2}).sort(function(x,y){return y.cr-x.cr});
h+='<h3>🔥 くりかえし言われていること</h3>';
if(!rp.length)h+='<div class="card sub">同じことを何回も言われている項目は、まだありません 👍</div>';
rp.forEach(function(x){var p=pm[x.h.k];h+='<div class="card"><b>'+x.h.i+' '+x.h.k+'</b> '+bd(x.st)+'<div class="q">コーチから '+x.cr+'回（最後 '+md(x.lastD)+'）'+(p&&p.nc?'<br>📅 前の月も言われていました（'+p.nc+'回）':'')+'</div>'+x.o.coach.slice(-3).map(function(c){return'<div class="q">🗣 '+esc(c.t)+'</div>'}).join("")+'</div>'});
h+='<h3>📈 言われたことは直っている？</h3><div class="card"><div class="q" style="margin:0 0 6px">コーチに言われたこと・できなかったこと・ママのメモに出てきた回数と、「できた」と書かれた回数です。指摘のあとに「できたこと」が書かれていれば改善中、と判定しています。</div>';
a.rows.slice().sort(function(x,y){return x.lastD<y.lastD?1:-1}).forEach(function(x){h+='<div style="padding:8px 0;border-bottom:1px dashed var(--line)"><b>'+x.h.i+' '+x.h.k+'</b> '+bd(x.st)+'<div class="q">'+parts(x)+(x.ng?'<br>✅ できた '+x.ng+'回':'')+'</div></div>'});
h+='</div>';
if(pv){var gone=pv.rows.filter(function(x){return x.np>0&&!a.rows.some(function(y){return y.h.k===x.h.k})});
if(gone.length){h+='<h3>🎉 前の月より減ったこと</h3><div class="card">'+gone.map(function(x){return'<div style="padding:6px 0"><b>'+x.h.i+' '+x.h.k+'</b><div class="q">前の月は '+parts(x)+' ありましたが、今月は出ていません</div></div>'}).join("")+'</div>'}}
var wk=a.rows.filter(function(x){return x.score>0}).sort(function(x,y){return y.score-x.score}).slice(0,3);
h+='<h3>🌱 これからの弱点</h3>';
if(!wk.length)h+='<div class="card sub">記録がたまると、ここに出ます。</div>';
wk.forEach(function(x,i){h+='<div class="card"><b>'+(i+1)+'. '+x.h.i+' '+x.h.k+'</b> '+bd(x.st)+'<div class="q">最近よく出ています（'+parts(x)+'、最後 '+md(x.lastD)+'）<br>👉 次の練習では「'+x.h.k+'」を意識してみよう</div></div>'});
return h+'<div class="sub" style="margin:8px 2px">※ 書かれた言葉から自動で分けているので、目安として見てください。</div>'}
function render(){nav();$("view").innerHTML=tab=="practice"?vPractice():tab=="goal"?vGoal():tab=="mama"?vMama():vMatch()}

/* 練習 */
function vPractice(){var n=new Date();if(!editPid&&draft.review===null)draft.review=prevNexts();
var h=(editPid?'<h2>✏️ 記録を修正する</h2>':'<h2>今日の練習 <span class="sub">'+(n.getMonth()+1)+'月'+n.getDate()+'日（'+W[n.getDay()]+'）</span></h2>')+'<div class="card">'+(editPid?'<h3 style="margin-top:0">📅 日付</h3><input type="date" id="d_date" value="'+esc(draft.date)+'" onchange="draft.date=this.value">':'')+'<h3'+(editPid?'':' style="margin-top:0"')+'>🏸 練習メニュー'+(draft.menus.length?' <span class="sub">（'+draft.menus.length+'こ選択中）</span>':'')+'</h3>';
var gi=0;MENU_GROUPS.forEach(function(g){h+='<div class="gt">'+g.t+'</div><div class="chips menu">';g.m.forEach(function(m){h+='<button class="chip'+(draft.menus.indexOf(m)>=0?" on":"")+'" onclick="tm('+(gi++)+')">'+m+'</button>'});h+='</div>'});
var lg=draft.menus.filter(function(m){return MENUS.indexOf(m)<0});if(lg.length){h+='<div class="gt">🕘 以前のメニュー</div><div class="chips menu">';lg.forEach(function(m){h+='<button class="chip on" onclick="tmn(\''+esc(m)+'\')">'+esc(m)+'</button>'});h+='</div>'}
if(draft.menus.indexOf("その他")>=0)h+='<h3>その他の練習内容</h3><input type="text" id="d_other" value="'+esc(draft.other)+'" oninput="draft.other=this.value" placeholder="どんな練習？">';
h+='<h3>✅ できたこと</h3><textarea id="d_good" oninput="draft.good=this.value" placeholder="今日できたことを書いてみよう">'+esc(draft.good)+'</textarea><div class="sub">例：サーブが奥まで飛んだ／構えて待つことができた</div>'
+'<h3>🌱 できなかったこと</h3><textarea oninput="draft.bad=this.value" placeholder="難しかったこと・できなかったことを書いてみよう">'+esc(draft.bad)+'</textarea><div class="sub">例：打ったあとに戻れなかった</div>'
+'<h3>🗣 コーチから言われたこと</h3><textarea oninput="draft.coach=this.value" placeholder="コーチに言われたことを書いてみよう">'+esc(draft.coach)+'</textarea><div class="sub">例：もっと早く構える／体全体を使って打つ</div>'
+reviewHtml()+'<h3>🌟 次の練習でがんばること</h3>'+nextHtml()
+'<button class="btn" onclick="savePractice()">'+(editPid?'修正を保存':'今日の練習を保存')+'</button>'+(editPid?'<button class="btn ghost" onclick="cancelEdit()">やめる</button>':'')+'</div>';
h+='<h2>📖 過去の練習記録</h2>';
var list=db.practices.slice().sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:b.id-a.id});
if(!list.length)h+='<div class="card sub">まだ記録がありません。最初の練習を記録しましょう 🏸</div>';
list.forEach(function(r){var d=r.date.split("-");var open=openId===r.id;
h+='<button class="rec" onclick="op('+r.id+')"><b>'+(+d[1])+'/'+(+d[2])+'</b>　'+esc(menuText(r))+(r.good?'<small>✅ できたこと：'+esc(r.good)+'</small>':'')+(r.bad?'<small>🌱 できなかったこと：'+esc(r.bad)+'</small>':'');
if(open)h+='<div class="det">'+'✅ できたこと\n'+esc(r.good||"（なし）")+'\n\n🌱 できなかったこと\n'+esc(r.bad||"（なし）")+'\n\n🗣 コーチから\n'+esc(r.coach||"（なし）")+'\n\n✔️ 前回のがんばること\n'+esc((r.review&&r.review.length)?r.review.map(function(x){return(x.done?"✅ ":"⬜ ")+x.text}).join("\n"):"（なし）")+'\n\n🌟 次の練習でがんばること\n'+esc(nextsOf(r).length?nextsOf(r).map(function(t){return"・"+t}).join("\n"):"（なし）")+(r.mama?'\n\n👩 ママのひとこと\n'+esc(r.mama):'')+'</div><div class="row" style="margin-top:8px"><span class="btn sm" style="display:inline-flex;align-items:center;justify-content:center" onclick="event.stopPropagation();startEdit('+r.id+')">✏️ 修正する</span><span class="btn sm ghost" style="display:inline-flex;align-items:center;justify-content:center;color:var(--warn)" onclick="event.stopPropagation();delP('+r.id+')">この記録を削除</span></div>';
h+='</button>'});
return h}
function menuText(r){return r.menus.map(function(m){return m=="その他"&&r.other?"その他("+r.other+")":m}).join("・")||"（メニューなし）"}
function tm(i){var m=MENUS[i],k=draft.menus.indexOf(m);if(k>=0)draft.menus.splice(k,1);else draft.menus.push(m);render()}
function nextsOf(r){return r.nexts||(r.next?[r.next]:[])}
function prevNexts(){var l=db.practices.slice().sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:b.id-a.id});for(var i=0;i<l.length;i++){var n=nextsOf(l[i]);if(n.length)return n.map(function(t){return{text:t,done:false}})}return[]}
function reviewHtml(){if(!draft.review||!draft.review.length)return"";var h='<h3>✔️ 前回のがんばること <span class="sub">できたらチェック</span></h3>';draft.review.forEach(function(x,i){h+='<label class="ck'+(x.done?" on":"")+'"><input type="checkbox"'+(x.done?" checked":"")+' onchange="tck('+i+')"><span>'+esc(x.text)+'</span></label>'});return h}
function nextHtml(){var h="";draft.nexts.forEach(function(t,i){h+='<div class="item"><span>'+esc(t)+'</span><button onclick="delNext('+i+')" aria-label="削除">✕</button></div>'});
h+='<div class="row" style="flex-wrap:nowrap"><input type="text" id="d_nextin" style="flex:1;min-width:0" value="'+esc(draft.nextIn)+'" oninput="draft.nextIn=this.value" onkeydown="if(event.key===\'Enter\'){addNext()}" placeholder="1つずつ書いて「追加」"><button class="btn sm" style="flex:none" onclick="addNext()">＋追加</button></div><div class="sub">例：打ったあとにすぐ戻る／サーブを奥まで打つ</div>';return h}
function addNext(){var v=draft.nextIn.trim();if(v){draft.nexts.push(v);draft.nextIn=""}render();var e=$("d_nextin");if(e)e.focus()}
function delNext(i){draft.nexts.splice(i,1);render()}
function tck(i){draft.review[i].done=!draft.review[i].done;render()}
function tmn(m){var k=draft.menus.indexOf(m);if(k>=0)draft.menus.splice(k,1);render()}
function startEdit(id){var r=db.practices.filter(function(x){return x.id===id})[0];if(!r)return;draft={menus:r.menus.slice(),other:r.other||"",good:r.good||"",bad:r.bad||"",coach:r.coach||"",nexts:nextsOf(r).slice(),nextIn:"",review:(r.review||[]).map(function(x){return{text:x.text,done:!!x.done}}),date:r.date};editPid=id;openId=null;render();window.scrollTo(0,0)}
function cancelEdit(){editPid=null;draft={menus:[],other:"",good:"",bad:"",coach:"",nexts:[],nextIn:"",review:null};render()}
function op(id){openId=openId===id?null:id;render()}
function delP(id){if(confirm("この記録を削除しますか？")){db.practices=db.practices.filter(function(r){return r.id!==id});save();openId=null;render()}}
function savePractice(){if(!draft.menus.length&&!draft.good&&!draft.bad&&!draft.coach&&!draft.nexts.length&&!draft.nextIn.trim()){toast("メニューか内容を入れてね");return}
var pend=draft.nextIn.trim();if(pend){draft.nexts.push(pend);draft.nextIn=""}
var rec={menus:draft.menus.slice(),other:draft.menus.indexOf("その他")>=0?draft.other:"",good:draft.good.trim(),bad:draft.bad.trim(),coach:draft.coach.trim(),nexts:draft.nexts.slice(),review:draft.review.map(function(x){return{text:x.text,done:x.done}})};
if(editPid){db.practices.forEach(function(r){if(r.id===editPid){for(var k in rec)r[k]=rec[k];delete r.next;if(draft.date)r.date=draft.date}});editPid=null;toast("修正しました ✏️")}else{rec.id=Date.now();rec.date=ymd(new Date());db.practices.push(rec);toast("練習を記録しました 🏸")}
save();draft={menus:[],other:"",good:"",bad:"",coach:"",nexts:[],nextIn:"",review:null};render();window.scrollTo(0,0)}

/* 目標 */
function mkey(){var n=new Date();return n.getFullYear()+"-"+p2(n.getMonth()+1)}
var gMonth=null,gForm=null,selGoal=null;
function mlabel(k){var a=k.split("-"),y=new Date().getFullYear();return(+a[0]!==y?a[0]+"年":"")+(+a[1])+"月"}
function gAvg(g){return Math.round(g.weeks.reduce(function(a,b){return a+b},0)/5)}
function gMonths(){var ks=Object.keys(db.goals).filter(function(k){return db.goals[k].length});if(ks.indexOf(mkey())<0)ks.push(mkey());return ks.sort()}
function formG(){var g=gForm==="new"?null:(db.goals[gMonth]||[]).filter(function(x){return x.id===gForm})[0];
var h='<div class="card"><h3 style="margin-top:0">🎯 '+(g?'目標の名前を変える':'目標を追加')+'</h3><input type="text" id="gt" value="'+esc(g?g.title:"")+'" placeholder="目標を書くか、下から選ぼう">';
if(!g){h+='<div class="row" style="margin-top:8px">';GOAL_EX.forEach(function(x,i){h+='<button class="chip" style="flex:1 1 100%;min-height:44px;font-size:14px" onclick="pickG('+i+')">'+x+'</button>'});h+='</div>'}
return h+'<button class="btn" onclick="saveG()">保存</button><button class="btn ghost" onclick="cancelG()">やめる</button></div>'}
function vGoal(){var n=new Date(),cur=mkey();if(!gMonth)gMonth=cur;var k=gMonth,list=db.goals[k]||[],ms=gMonths();if(ms.indexOf(k)<0){ms.push(k);ms.sort()}
if(selWeek===null)selWeek=Math.min(5,Math.ceil(n.getDate()/7))-1;
var mi=ms.indexOf(k),prev=mi>0?ms[mi-1]:null,next=mi<ms.length-1?ms[mi+1]:null;
var h='<h2>'+mlabel(k)+'の目標 🎯'+(k!==cur?' <span class="badge">📖 ふりかえり</span>':'')+'</h2>';
h+='<div class="row" style="flex-wrap:nowrap;margin-bottom:10px"><button class="btn sm ghost" style="flex:1;opacity:'+(prev?1:.35)+'" '+(prev?'onclick="gm(\''+prev+'\')"':'disabled')+'>◀ '+(prev?mlabel(prev):"")+'</button><button class="btn sm ghost" style="flex:1;opacity:'+(next?1:.35)+'" '+(next?'onclick="gm(\''+next+'\')"':'disabled')+'>'+(next?mlabel(next):"")+' ▶</button></div>';
if(k!==cur)h+='<button class="btn ghost" style="margin:0 0 10px" onclick="gm(\''+cur+'\')">今月にもどる</button>';
if(list.length){var avg=Math.round(list.reduce(function(a,g){return a+gAvg(g)},0)/list.length);
h+='<div class="card"><div class="sub">📈 この月の平均（目標 '+list.length+'つ）</div><div class="avg">'+avg+'%</div><div class="bar" style="margin-top:6px"><i style="width:'+avg+'%"></i></div></div>'}
else if(gForm!=="new")h+='<div class="card sub">この月の目標はまだありません。</div>';
list.forEach(function(g){var sel=selGoal===g.id,a=gAvg(g);
h+='<div class="card"><button style="width:100%;text-align:left;border:0;background:none;color:var(--ink);padding:0;font-size:16px" onclick="sg('+g.id+')"><div style="display:flex;justify-content:space-between;gap:8px;font-weight:800"><span>🎯 '+esc(g.title)+'</span><span style="color:var(--mainD)">'+a+'%</span></div><div class="bar" style="margin-top:8px"><i style="width:'+a+'%"></i></div><div class="sub" style="margin-top:6px">'+(sel?'▲ とじる':'▼ 週ごとの進捗を見る・入力')+'</div></button>';
if(sel){if(gForm===g.id)h+=formG();else{
for(var i=0;i<5;i++)h+='<button class="wk'+(i==selWeek?" sel":"")+'" onclick="sw('+i+')"><span>第'+(i+1)+'週</span><div class="bar"><i style="width:'+g.weeks[i]+'%"></i></div><span>'+g.weeks[i]+'%</span></button>';
h+='<h3>第'+(selWeek+1)+'週は何％できた？</h3><div class="pct">';
for(var v=0;v<=100;v+=10)h+='<button class="chip'+(g.weeks[selWeek]===v?" on":"")+'" onclick="setP('+v+')">'+v+'%'+(v==100?"🎉":"")+'</button>';
h+='</div><div class="row" style="margin-top:12px"><button class="btn sm ghost" onclick="editGoal('+g.id+')">✏️ 名前を変える</button><button class="btn sm ghost warn" onclick="delG('+g.id+')">🗑 削除</button></div>'}}
h+='</div>'});
if(gForm==="new")h+=formG();else if(gForm===null)h+='<button class="btn" style="margin-top:0" onclick="addG()">＋ 目標を追加</button>';
var ps=db.practices.filter(function(r){return r.date.slice(0,7)==k}),cnt={};
ps.forEach(function(r){r.menus.forEach(function(m){cnt[m]=(cnt[m]||0)+1})});
var top=Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a]}).slice(0,3).map(function(m){return m+"("+cnt[m]+"回)"}).join("、");
h+='<div class="card" style="margin-top:12px"><h3 style="margin-top:0">📝 '+mlabel(k)+'のふりかえり</h3>練習した回数：<b>'+ps.length+'回</b><br>よく練習したメニュー：'+(top||"まだありません")+'<div class="sub" style="margin-top:6px">✅ できたこと '+ps.filter(function(r){return r.good}).length+'件 ／ 🌱 できなかったこと '+ps.filter(function(r){return r.bad}).length+'件</div></div>';
return h}
function gm(k){gMonth=k;selGoal=null;gForm=null;render();window.scrollTo(0,0)}
function sg(id){selGoal=selGoal===id?null:id;gForm=null;render()}
function addG(){gForm="new";render()}
function editGoal(id){gForm=id;render()}
function cancelG(){gForm=null;render()}
function pickG(i){$("gt").value=GOAL_EX[i]}
function saveG(){var t=$("gt").value.trim();if(!t){toast("目標を入れてね");return}var L=db.goals[gMonth]=db.goals[gMonth]||[];
if(gForm==="new"){var g={id:Date.now(),title:t,weeks:[0,0,0,0,0]};L.push(g);selGoal=g.id}else L.forEach(function(x){if(x.id===gForm)x.title=t});
gForm=null;save();toast("目標を保存しました 🎯");render()}
function delG(id){if(!confirm("この目標を削除しますか？"))return;db.goals[gMonth]=(db.goals[gMonth]||[]).filter(function(x){return x.id!==id});selGoal=null;save();render()}
function sw(i){selWeek=i;render()}
function setP(v){(db.goals[gMonth]||[]).forEach(function(g){if(g.id===selGoal)g.weeks[selWeek]=v});save();render()}

/* 大会 */
function daysLeft(s){if(!s)return null;var a=s.split("-"),t=new Date(+a[0],+a[1]-1,+a[2]),n=new Date();n=new Date(n.getFullYear(),n.getMonth(),n.getDate());return Math.round((t-n)/86400000)}
var EVT=["シングルス","ダブルス"],EVI={"シングルス":"👤","ダブルス":"👥"};var tdraft=null,tNew=false;
function fmtD(s){var a=s.split("-");return a[0]+"/"+(+a[1])+"/"+(+a[2])}
function vMatch(){var h='<h2>次の大会 🏆</h2>';
var list=db.tournaments.slice().sort(function(a,b){var x=a.date||"9999",y=b.date||"9999";return x<y?-1:x>y?1:0});
var up=null;list.forEach(function(t){if(!up&&t.date&&daysLeft(t.date)>=0)up=t});var d=up?daysLeft(up.date):null;
h+='<div class="big">'+(up?(d===0?'<div>今日が大会！ 🏸</div><small>'+esc(up.name||"大会")+'</small>':'<small>'+esc(up.name||"大会")+'まで</small><div>あと '+d+' 日</div>'):'<small>大会を追加しよう</small>')+'</div>';
if(!tdraft)h+='<button class="btn" style="margin-top:0;margin-bottom:12px" onclick="newT()">＋ 大会を追加</button>';else if(tNew)h+=formT();
list.forEach(function(t){if(tdraft&&!tNew&&tdraft.id===t.id){h+=formT();return}
var dl=t.date?daysLeft(t.date):null,past=dl!==null&&dl<0;
h+='<button class="rec'+(past?" past":"")+'" onclick="editT('+t.id+')"><b>'+esc(t.name||"（名前なし）")+'</b>　'+(t.date?fmtD(t.date):"日にち未定")+(dl===null?"":past?"　終了":dl===0?"　今日！":"　あと"+dl+"日");
t.events.forEach(function(e){h+='<small>'+EVI[e.type]+' '+e.type+'：'+esc(e.goal||"目標はこれから")+'</small>'});
if(t.goal)h+='<small>🚩 '+esc(t.goal)+'</small>';
var fs=t.focus.map(function(f){return f=="その他"&&t.focusOther?"その他("+t.focusOther+")":f});
if(fs.length)h+='<small>🔥 '+esc(fs.join("・"))+'</small>';
h+='</button>'});
if(!list.length&&!tdraft)h+='<div class="card sub">まだ大会が登録されていません。</div>';
h+='<div class="card"><h3 style="margin-top:0">バックアップ 💾</h3><div class="sub" style="margin-bottom:10px">記録をファイルに保存したり、別のスマホやURLに移したりできます。</div><div class="row"><button class="btn sm" onclick="exportData()">📤 書き出し</button><label class="btn sm ghost" style="display:inline-flex;align-items:center;justify-content:center">📥 読み込み<input type="file" accept=".json,application/json,text/plain" class="hide" onchange="importData(this)"></label></div><div class="row" style="margin-top:8px"><button class="btn sm ghost" onclick="exportText()">📋 テキストでコピー</button><button class="btn sm ghost" onclick="showPaste()">📝 貼り付けて読み込み</button></div>'+(bkOpen?'<textarea id="bk" style="margin-top:10px;font-size:12px;min-height:110px" placeholder="ここにバックアップのテキストを貼り付け"></textarea><button class="btn sm" style="margin-top:8px" onclick="importText()">このテキストから読み込む</button>':'')+'</div>';return h}
function formT(){var t=tdraft;var h='<div class="card"><h3 style="margin-top:0">🏆 大会名</h3><input type="text" id="tn" value="'+esc(t.name)+'" placeholder="大会名"><h3>📅 大会日</h3><input type="date" id="td" value="'+esc(t.date)+'"><h3>🎽 出る種目</h3><div class="chips">';
EVT.forEach(function(e,i){var on=t.events.some(function(x){return x.type==e});h+='<button class="chip'+(on?" on":"")+'" onclick="te('+i+')">'+EVI[e]+' '+e+'</button>'});
h+='</div>';
t.events.forEach(function(e,i){h+='<h3>'+EVI[e.type]+' '+e.type+'の目標</h3><input type="text" id="ev'+i+'" value="'+esc(e.goal)+'" placeholder="例：まず1勝する">'});
h+='<h3>🚩 大会全体の目標（なくてもOK）</h3><input type="text" id="tg" value="'+esc(t.goal)+'" placeholder="例：最後まであきらめない"><h3>🔥 重点課題</h3><div class="chips">';
FOCUS.forEach(function(f,i){h+='<button class="chip'+(t.focus.indexOf(f)>=0?" on":"")+'" onclick="tf('+i+')">'+f+'</button>'});
h+='</div>';if(t.focus.indexOf("その他")>=0)h+='<input type="text" id="to" style="margin-top:8px" value="'+esc(t.focusOther)+'" placeholder="その他の課題">';
h+='<button class="btn" onclick="saveT()">この大会を保存</button><div class="row" style="margin-top:8px"><button class="btn sm ghost" onclick="cancelT()">やめる</button>'+(tNew?'':'<button class="btn sm ghost warn" onclick="delT()">削除</button>')+'</div></div>';return h}
function readT(){var t=tdraft;if(!t||!$("tn"))return;t.name=$("tn").value.trim();t.date=$("td").value;t.goal=$("tg").value.trim();t.events.forEach(function(e,i){var el=$("ev"+i);if(el)e.goal=el.value.trim()});if($("to"))t.focusOther=$("to").value.trim()}
function newT(){tdraft={id:Date.now(),name:"",date:"",goal:"",events:[],focus:[],focusOther:""};tNew=true;render()}
function editT(id){var t=db.tournaments.filter(function(x){return x.id===id})[0];if(!t)return;tdraft=JSON.parse(JSON.stringify(t));tNew=false;render()}
function cancelT(){tdraft=null;render()}
function te(i){readT();var ty=EVT[i],k=-1;tdraft.events.forEach(function(e,j){if(e.type==ty)k=j});if(k>=0)tdraft.events.splice(k,1);else{tdraft.events.push({type:ty,goal:""});tdraft.events.sort(function(a,b){return EVT.indexOf(a.type)-EVT.indexOf(b.type)})}render()}
function tf(i){readT();var f=FOCUS[i],k=tdraft.focus.indexOf(f);if(k>=0)tdraft.focus.splice(k,1);else tdraft.focus.push(f);render()}
function saveT(){readT();if(!tdraft.name&&!tdraft.date){toast("大会名か大会日を入れてね");return}
if(tNew)db.tournaments.push(tdraft);else db.tournaments=db.tournaments.map(function(x){return x.id===tdraft.id?tdraft:x});
save();tdraft=null;toast("大会を保存しました 🏆");render()}
function delT(){if(!confirm("この大会を削除しますか？"))return;var id=tdraft.id;db.tournaments=db.tournaments.filter(function(x){return x.id!==id});save();tdraft=null;render()}
function exportData(){try{var b=new Blob([JSON.stringify(db)],{type:"application/json"});var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="hana-bad-backup-"+ymd(new Date())+".json";document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1000);toast("書き出しました 📤")}catch(e){toast("書き出せませんでした")}}
function applyImport(txt){try{var d=JSON.parse(txt);if(!d||!Array.isArray(d.practices)||typeof d.goals!=="object"||!d.goals||!(d.tournament||Array.isArray(d.tournaments)))throw 0;
if(!confirm("練習記録"+d.practices.length+"件を読み込みます。今のデータは上書きされます。よろしいですか？"))return;
db=normalize(d);save();bkOpen=false;toast("読み込みました 📥");render()}catch(e){toast("読み込めないデータです")}}
function importData(inp){var f=inp.files[0];if(!f)return;var r=new FileReader();r.onload=function(){applyImport(r.result);inp.value=""};r.readAsText(f)}
function exportText(){bkOpen=true;render();var t=$("bk");t.value=JSON.stringify(db);t.focus();t.select();try{document.execCommand("copy");toast("コピーしました 📋")}catch(e){toast("全選択しました。コピーしてください")}}
function showPaste(){bkOpen=true;render();var t=$("bk");t.value="";t.focus()}
function importText(){applyImport($("bk").value)}
render();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}</script>
